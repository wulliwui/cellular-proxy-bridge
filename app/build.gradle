plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'cn.cellularbridge.app'
    compileSdk 34

    defaultConfig {
        applicationId 'cn.cellularbridge.app'
        minSdk 33
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
